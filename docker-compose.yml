name: chamados-manutencao

services:
  postgres:
    image: postgres:17-alpine
    container_name: chamados_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chamados_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:5
    container_name: chamados_adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/ChamadosManutencao.Api/Dockerfile
    container_name: chamados_api
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres}
      Jwt__Emissor: ${Jwt__Emissor}
      Jwt__Audiencia: ${Jwt__Audiencia}
      Jwt__ChaveSecreta: ${Jwt__ChaveSecreta}
      Jwt__MinutosDeValidade: ${Jwt__MinutosDeValidade}
    volumes:
      - chamados_anexos:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  chamados_pgdata:
  chamados_anexos:
